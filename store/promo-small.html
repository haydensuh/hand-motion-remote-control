<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Small promo</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: #ffffff;
        font-family: "Apple SD Gothic Neo", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: -0.03em;
      }
      .tile {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 440px;
        height: 280px;
        padding: 28px 32px;
      }
      svg { display: block; width: 72px; height: 72px; }
      h1 {
        margin: 18px 0 0;
        color: #191f28;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 700;
      }
      p {
        margin: 8px 0 0;
        color: #4e5968;
        font-size: 16px;
        line-height: 1.4;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
        <rect width="128" height="128" rx="32" fill="#3182F6"/>
        <g fill="#FFFFFF">
          <rect x="36" y="34" width="14" height="40" rx="7"/>
          <rect x="56" y="24" width="14" height="50" rx="7"/>
          <rect x="76" y="32" width="14" height="42" rx="7"/>
          <rect x="30" y="66" width="68" height="34" rx="17"/>
          <circle cx="34" cy="84" r="11"/>
        </g>
      </svg>
      <h1>Hand Motion<br />Remote Control</h1>
      <p>Control web pages with hand gestures.</p>
    </div>
  </body>
</html>
