<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hand camera</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="camera">
    <main>
      <h1>Turn on the camera</h1>
      <p class="lead">Keep this window open. The camera stays on when you switch tabs.</p>
      <div class="preview">
        <video id="webcam" autoplay playsinline muted></video>
      </div>
      <table class="guide">
        <thead>
          <tr>
            <th>Gesture</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Index finger</td>
            <td>Move cursor</td>
          </tr>
          <tr>
            <td>V sign</td>
            <td>Click</td>
          </tr>
          <tr>
            <td>Fist</td>
            <td>Scroll down</td>
          </tr>
          <tr>
            <td>Thumb up</td>
            <td>Scroll up</td>
          </tr>
          <tr>
            <td>Open palm</td>
            <td>Stop scrolling</td>
          </tr>
        </tbody>
      </table>
      <section class="card">
        <p class="label">Current gesture</p>
        <p id="gesture"></p>
      </section>
      <p id="status">Press Start camera, then choose Allow.</p>
      <div class="actions">
        <button id="start" class="primary" type="button">Start camera</button>
        <button id="settings" class="weak" type="button" hidden>Open Chrome camera settings</button>
      </div>
    </main>
    <script type="module" src="camera.js"></script>
  </body>
</html>
