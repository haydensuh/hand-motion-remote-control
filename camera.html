<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>카메라 허용</title>
    <style>
      body {
        margin: 0 auto;
        max-width: 480px;
        padding: 24px 16px;
        font-family: system-ui, sans-serif;
        color: #1c1c1c;
        background: #f6f6f4;
      }

      video {
        display: block;
        width: 100%;
        max-height: 320px;
        object-fit: cover;
        border-radius: 8px;
        background: #111;
        transform: scaleX(-1);
      }

      button {
        width: 100%;
        margin-top: 12px;
        padding: 10px 12px;
        font: inherit;
      }

      #status,
      #gesture {
        margin: 12px 0 0;
        word-break: break-word;
      }

      #gesture {
        min-height: 1.4em;
        font-size: 1.25rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>손 동작 카메라</h1>
    <p>이 창을 닫지 마세요. 다른 탭으로 이동해도 카메라는 켜져 있습니다. 검지를 펴 커서를 움직이고, 브이를 하면 클릭합니다.</p>
    <video id="webcam" autoplay playsinline muted></video>
    <button id="start" type="button">카메라 시작</button>
    <button id="settings" type="button" hidden>크롬 카메라 설정 열기</button>
    <p id="status">카메라 시작을 누른 뒤 허용을 선택해 주세요.</p>
    <p id="gesture"></p>
    <script type="module" src="camera.js"></script>
  </body>
</html>
