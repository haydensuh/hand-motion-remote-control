<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>손 동작 인식</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        color: #1c1c1c;
        background: #f6f6f4;
      }

      video {
        display: block;
        width: 100%;
        max-height: 240px;
        object-fit: cover;
        border-radius: 8px;
        background: #111;
        transform: scaleX(-1);
      }

      button {
        width: 100%;
        margin-top: 12px;
        padding: 10px 12px;
        font: inherit;
      }

      #status,
      #gesture {
        margin: 12px 0 0;
      }

      #gesture {
        min-height: 1.4em;
        font-size: 1.25rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <video id="webcam" autoplay playsinline muted></video>
    <button id="start" type="button">카메라 시작</button>
    <p id="status">카메라를 시작하면 손 모양을 인식합니다.</p>
    <p id="gesture"></p>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
