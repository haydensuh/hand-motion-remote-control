<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hand control</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Hand control</h1>
      <p class="lead">Point to move the cursor. Make a V to click.</p>
      <section class="card">
        <p class="label">Current gesture</p>
        <p id="gesture"></p>
      </section>
      <p id="status">Start the camera to recognize your hand.</p>
      <div class="actions">
        <button id="start" class="primary" type="button">Start camera</button>
      </div>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
